<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>企业官网首页</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary-color: #1f3a8a;
            --secondary-color: #2563eb;
            --bg-light: #f8fafc;
            --text-dark: #0f172a;
            --text-gray: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            color: var(--text-dark);
            line-height: 1.6;
            background-color: #ffffff;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: #ffffff;
            padding: 24px 0 80px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-links a {
            margin-left: 24px;
            font-size: 15px;
            opacity: 0.9;
        }

        .nav-links a:hover {
            opacity: 1;
        }

        .hero {
            margin-top: 80px;
            max-width: 600px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            opacity: 0.95;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            background-color: #ffffff;
            color: var(--primary-color);
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        /* Section */
        section {
            padding: 80px 0;
        }

        .section-title {
            text-align: center;
            margin-bottom: 48px;
        }

        .section-title h2 {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .section-title p {
            color: var(--text-gray);
            font-size: 16px;
        }

        /* Services */
        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 32px;
        }

        .service-card {
            background-color: var(--bg-light);
            padding: 32px;
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .service-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        .service-card h3 {
            margin-bottom: 12px;
            font-size: 20px;
        }

        .service-card p {
            color: var(--text-gray);
            font-size: 15px;
        }

        /* CTA */
        .cta {
            background-color: var(--primary-color);
            color: #ffffff;
            text-align: center;
            padding: 80px 20px;
        }

        .cta h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .cta p {
            font-size: 17px;
            margin-bottom: 32px;
            opacity: 0.95;
        }

        /* Footer */
        footer {
            background-color: #020617;
            color: #cbd5f5;
            padding: 32px 0;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="container">
        <div class="nav">
            <div class="logo">YourBrand</div>
            <div class="nav-links">
                <a href="#">首页</a>
                <a href="#">服务</a>
                <a href="#">案例</a>
                <a href="#">关于我们</a>
                <a href="#">联系</a>
            </div>
        </div>

        <div class="hero">
            <h1>打造专业、高端、可信赖的数字产品</h1>
            <p>
                我们专注于企业级网站与系统解决方案，帮助客户提升品牌价值，实现业务增长。
            </p>
            <a href="#" class="btn">立即咨询</a>
        </div>
    </div>
</header>

<section>
    <div class="container">
        <div class="section-title">
            <h2>我们的服务</h2>
            <p>为企业提供全方位的数字化解决方案</p>
        </div>

        <div class="services">
            <div class="service-card">
                <h3>企业官网设计</h3>
                <p>专业的视觉设计与信息架构，提升品牌形象和用户信任感。</p>
            </div>
            <div class="service-card">
